# Copiar a docker-compose.override.yml y ajustar usuario/ruta si hace falta:
#   cp docker-compose.override.example.yml docker-compose.override.yml
#
# docker-compose.override.yml está en .gitignore para no subir rutas locales.
#
# backend y autobackup deben usar la MISMA carpeta host de grabaciones.

services:
  backend:
    # Red del host: el descubrimiento ONVIF usa multicast UDP (239.255.255.250:3702),
    # que no atraviesa la red bridge de Docker. Solo en Linux; en Docker Desktop para
    # Windows no funciona y el descubrimiento queda sin soporte (usar alta manual).
    network_mode: host
    # Con red de host no hay DNS de Compose: db se alcanza por el puerto publicado en el host.
    environment:
      DATABASE_URL: postgresql://camerakontrol:camerakontrol@127.0.0.1:5433/camerakontrol
    ports: []
    volumes:
      - /home/eaguilar/apps/data/camerakontrol:/app/recordings

  autobackup:
    volumes:
      - /home/eaguilar/apps/data/camerakontrol:/data/recordings:ro
      # RW: rclone renueva el token OAuth en rclone.conf
      - ./autobackup/config:/config

  frontend:
    ports:
      - "8080:5173"
